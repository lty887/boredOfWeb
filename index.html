<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>无聊的网页集合</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #6a9bcc;
            --secondary-color: #788c5d;
            --accent-color: #d97757;
            --background-color: #faf9f5;
            --text-color: #141413;
            --card-color: #ffffff;
            --mid-gray: #b0aea5;
            --light-gray: #e8e6dc;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            --border-radius: 8px;
            --transition: all 0.3s ease;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Lora', Georgia, serif;
            background-color: var(--background-color);
            color: var(--text-color);
            line-height: 1.6;
            overflow-x: hidden;
        }
        
        h1, h2, h3, h4, h5, h6 {
            font-family: 'Poppins', Arial, sans-serif;
        }
        
        header {
            text-align: center;
            padding: 4rem 2rem;
            position: relative;
            overflow: hidden;
        }
        
        h1 {
            font-size: 3rem;
            font-weight: 800;
            margin-bottom: 1rem;
            z-index: 2;
            position: relative;
            color: var(--text-color);
        }
        
        p {
            font-size: 1.2rem;
            max-width: 600px;
            margin: 0 auto;
            z-index: 2;
            position: relative;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }
        
        .websites-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2rem;
            margin-top: 2rem;
        }
        
        .website-card {
            background-color: var(--card-color);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            padding: 2rem;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
            opacity: 0;
            transform: translateY(20px);
        }
        
        .website-card.visible {
            opacity: 1;
            transform: translateY(0);
        }
        
        .website-card:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.15);
        }
        
        .website-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }
        
        .website-card:hover::before {
            left: 100%;
        }
        
        .website-card h2 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            color: var(--primary-color);
        }
        
        .website-card p {
            font-size: 1rem;
            margin-bottom: 1.5rem;
            color: var(--text-color);
        }
        
        .website-card a {
            display: inline-block;
            padding: 0.75rem 1.5rem;
            background-color: var(--primary-color);
            color: white;
            text-decoration: none;
            border-radius: var(--border-radius);
            transition: var(--transition);
        }
        
        .website-card a:hover {
            background-color: var(--secondary-color);
            transform: scale(1.05);
        }
        
        footer {
            text-align: center;
            padding: 2rem;
            margin-top: 4rem;
            background-color: var(--text-color);
            color: white;
        }
        
        /* 算法艺术背景 */
        #art-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            opacity: 0.3;
        }
        
        @media (max-width: 768px) {
            header {
                padding: 2rem 1rem;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .container {
                padding: 1rem;
            }
            
            .websites-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header>
        <canvas id="art-canvas"></canvas>
        <h1>无聊的网页集合</h1>
        <p>探索一系列专为打发时间而设计的无聊网页</p>
    </header>
    
    <div class="container">
        <div class="websites-grid">
            <div class="website-card">
                <h2>随机点击游戏</h2>
                <p>点击屏幕上随机出现的按钮，看你能多快点击到它们。</p>
                <a href="#" target="_blank">访问</a>
            </div>
            
            <div class="website-card">
                <h2>数字计数</h2>
                <p>从1开始，一直数到你想停止为止。</p>
                <a href="#" target="_blank">访问</a>
            </div>
            
            <div class="website-card">
                <h2>颜色变化器</h2>
                <p>点击按钮，随机改变页面背景颜色。</p>
                <a href="#" target="_blank">访问</a>
            </div>
            
            <div class="website-card">
                <h2>文字生成器</h2>
                <p>随机生成无意义的句子，打发时间的好工具。</p>
                <a href="#" target="_blank">访问</a>
            </div>
            
            <div class="website-card">
                <h2>粒子效果</h2>
                <p>观看屏幕上随机运动的粒子，放松心情。</p>
                <a href="#" target="_blank">访问</a>
            </div>
            
            <div class="website-card">
                <h2>时钟</h2>
                <p>一个简单的数字时钟，显示当前时间。</p>
                <a href="#" target="_blank">访问</a>
            </div>
        </div>
    </div>
    
    <footer>
        <p>© 2026 无聊的网页集合</p>
    </footer>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <script>
        // 算法艺术背景
        let particles = [];
        let noiseScale = 0.01;
        let noiseStrength = 2;
        
        function setup() {
            const canvas = createCanvas(windowWidth, windowHeight);
            canvas.parent('art-canvas');
            noStroke();
            
            // 创建粒子
            for (let i = 0; i < 200; i++) {
                particles.push({
                    x: random(width),
                    y: random(height),
                    size: random(1, 3),
                    speed: random(0.5, 2),
                    color: color(random(100, 255), random(100, 255), random(100, 255), 100)
                });
            }
        }
        
        function draw() {
            // 半透明背景，创建轨迹效果
            background(248, 249, 250, 10);
            
            // 更新和绘制粒子
            for (let p of particles) {
                // 使用Perlin噪声控制粒子方向
                let noiseValue = noise(p.x * noiseScale, p.y * noiseScale, frameCount * 0.001);
                let angle = noiseValue * TWO_PI * noiseStrength;
                
                // 更新粒子位置
                p.x += cos(angle) * p.speed;
                p.y += sin(angle) * p.speed;
                
                // 边界检测
                if (p.x < 0) p.x = width;
                if (p.x > width) p.x = 0;
                if (p.y < 0) p.y = height;
                if (p.y > height) p.y = 0;
                
                // 绘制粒子
                fill(p.color);
                ellipse(p.x, p.y, p.size);
            }
        }
        
        // 响应窗口大小变化
        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
        }
        
        // 滚动动画效果
        document.addEventListener('DOMContentLoaded', function() {
            const cards = document.querySelectorAll('.website-card');
            
            function checkVisibility() {
                cards.forEach(card => {
                    const rect = card.getBoundingClientRect();
                    const windowHeight = window.innerHeight;
                    
                    if (rect.top < windowHeight * 0.85) {
                        card.classList.add('visible');
                    }
                });
            }
            
            // 初始检查
            checkVisibility();
            
            // 滚动时检查
            window.addEventListener('scroll', checkVisibility);
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>无聊的网页集合</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #6a9bcc;
            --secondary-color: #788c5d;
            --accent-color: #d97757;
            --background-color: #faf9f5;
            --text-color: #141413;
            --card-color: #ffffff;
            --mid-gray: #b0aea5;
            --light-gray: #e8e6dc;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            --border-radius: 8px;
            --transition: all 0.3s ease;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Lora', Georgia, serif;
            background-color: var(--background-color);
            color: var(--text-color);
            line-height: 1.6;
            overflow-x: hidden;
        }
        
        h1, h2, h3, h4, h5, h6 {
            font-family: 'Poppins', Arial, sans-serif;
        }
        
        header {
            text-align: center;
            padding: 8rem 2rem;
            position: relative;
            overflow: hidden;
            background-image: url('https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=abstract%20geometric%20pattern%20with%20soft%20colors%20and%20subtle%20gradient&image_size=landscape_16_9');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0;
            transform: translateY(-20px);
            transition: all 1s ease;
        }
        
        header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.3);
            z-index: 1;
        }
        
        header.visible {
            opacity: 1;
            transform: translateY(0);
        }
        
        h1 {
            font-size: 4rem;
            font-weight: 800;
            margin-bottom: 1rem;
            z-index: 2;
            position: relative;
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            opacity: 0;
            transform: translateY(20px);
            transition: all 1s ease 0.3s;
        }
        
        h1.visible {
            opacity: 1;
            transform: translateY(0);
        }
        
        header p {
            font-size: 1.5rem;
            max-width: 600px;
            margin: 0 auto;
            z-index: 2;
            position: relative;
            color: white;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
            opacity: 0;
            transform: translateY(20px);
            transition: all 1s ease 0.6s;
        }
        
        header p.visible {
            opacity: 1;
            transform: translateY(0);
        }
        
        .container p {
            font-size: 1.2rem;
            max-width: 600px;
            margin: 0 auto;
            color: var(--text-color);
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }
        
        .websites-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2rem;
            margin-top: 2rem;
        }
        
        .website-card {
            background-color: var(--card-color);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            padding: 2rem;
            transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
            opacity: 0;
            transform: translateY(30px) scale(0.95);
        }
        
        .website-card.visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
        
        .website-card:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.15);
        }
        
        .website-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }
        
        .website-card:hover::before {
            left: 100%;
        }
        
        .website-card h2 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            color: var(--primary-color);
            transition: all 0.3s ease;
        }
        
        .website-card p {
            font-size: 1rem;
            margin-bottom: 1.5rem;
            color: var(--text-color);
            transition: all 0.3s ease;
        }
        
        .website-card a {
            display: inline-block;
            padding: 0.75rem 1.5rem;
            background-color: var(--primary-color);
            color: white;
            text-decoration: none;
            border-radius: var(--border-radius);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .website-card a::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }
        
        .website-card a:hover {
            background-color: var(--secondary-color);
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        .website-card a:hover::before {
            left: 100%;
        }
        
        .website-card:hover h2 {
            color: var(--accent-color);
            transform: translateX(5px);
        }
        
        .website-card:hover p {
            transform: translateX(3px);
        }
        
        footer {
            text-align: center;
            padding: 2rem;
            margin-top: 4rem;
            background-color: var(--text-color);
            color: white;
        }
        

        
        @media (max-width: 768px) {
            header {
                padding: 2rem 1rem;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .container {
                padding: 1rem;
            }
            
            .websites-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>无聊的网页集合</h1>
        <p>探索一系列专为打发时间而设计的无聊网页</p>
    </header>
    
    <div class="container">
        <div class="websites-grid">
            <div class="website-card">
                <h2>随机点击游戏</h2>
                <p>点击屏幕上随机出现的按钮，看你能多快点击到它们。</p>
                <a href="#" target="_blank">访问</a>
            </div>
            
            <div class="website-card">
                <h2>数字计数</h2>
                <p>从1开始，一直数到你想停止为止。</p>
                <a href="#" target="_blank">访问</a>
            </div>
            
            <div class="website-card">
                <h2>颜色变化器</h2>
                <p>点击按钮，随机改变页面背景颜色。</p>
                <a href="#" target="_blank">访问</a>
            </div>
            
            <div class="website-card">
                <h2>文字生成器</h2>
                <p>随机生成无意义的句子，打发时间的好工具。</p>
                <a href="#" target="_blank">访问</a>
            </div>
            
            <div class="website-card">
                <h2>粒子效果</h2>
                <p>观看屏幕上随机运动的粒子，放松心情。</p>
                <a href="#" target="_blank">访问</a>
            </div>
            
            <div class="website-card">
                <h2>时钟</h2>
                <p>一个简单的数字时钟，显示当前时间。</p>
                <a href="#" target="_blank">访问</a>
            </div>
        </div>
    </div>
    
    <footer>
        <p>© 2026 无聊的网页集合</p>
    </footer>
    
    <script>
        // 滚动动画效果
        document.addEventListener('DOMContentLoaded', function() {
            const cards = document.querySelectorAll('.website-card');
            const header = document.querySelector('header');
            const title = document.querySelector('h1');
            const subtitle = document.querySelector('header p');
            
            // 添加入场动画类
            setTimeout(() => {
                header.classList.add('visible');
                title.classList.add('visible');
                subtitle.classList.add('visible');
            }, 100);
            
            function checkVisibility() {
                cards.forEach((card, index) => {
                    const rect = card.getBoundingClientRect();
                    const windowHeight = window.innerHeight;
                    
                    if (rect.top < windowHeight * 0.85 && !card.classList.contains('visible')) {
                        setTimeout(() => {
                            card.classList.add('visible');
                        }, index * 150);
                    }
                });
            }
            
            // 初始检查
            checkVisibility();
            
            // 滚动时检查
            window.addEventListener('scroll', checkVisibility);
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员登录 - 无聊的网页集合</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">
    <div class="container">
        <div class="row justify-content-center mt-5">
            <div class="col-md-6">
                <div class="card shadow-lg rounded-lg overflow-hidden">
                    <div class="card-header bg-primary text-white text-center">
                        <h3>管理员登录</h3>
                    </div>
                    <div class="card-body p-5">
                        <form id="login-form">
                            <div class="mb-4">
                                <label for="username" class="form-label">用户名</label>
                                <input type="text" id="username" class="form-control" placeholder="请输入用户名" required>
                            </div>
                            <div class="mb-4">
                                <label for="password" class="form-label">密码</label>
                                <input type="password" id="password" class="form-control" placeholder="请输入密码" required>
                            </div>
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary btn-lg">登录</button>
                            </div>
                            <div id="login-error" class="mt-3 text-danger text-center"></div>
                        </form>
                    </div>
                    <div class="card-footer bg-light text-center">
                        <p class="mb-0">© 2026 无聊的网页集合管理后台</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 检查是否已登录
            if (localStorage.getItem('token')) {
                window.location.href = 'index.html';
            }

            // 登录表单提交
            document.getElementById('login-form').addEventListener('submit', function(e) {
                e.preventDefault();
                const username = document.getElementById('username').value;
                const password = document.getElementById('password').value;
                const errorDiv = document.getElementById('login-error');

                errorDiv.textContent = '';

                // 调用登录API
                fetch('http://localhost:8000/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                })
                .then(response => response.json())
                .then(data => {
                    if (data.token) {
                        // 存储token
                        localStorage.setItem('token', data.token);
                        localStorage.setItem('user', JSON.stringify(data.user));
                        // 跳转到管理后台
                        window.location.href = 'index.html';
                    } else if (data.error) {
                        errorDiv.textContent = data.error;
                    } else {
                        errorDiv.textContent = '登录失败，请重试';
                    }
                })
                .catch(error => {
                    console.error('登录错误:', error);
                    errorDiv.textContent = '服务器错误，请稍后重试';
                });
            });
        });
    </script>
</body>
</html>
